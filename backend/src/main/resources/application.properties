spring.application.name=backend

# MongoDB connection string loaded from environment variables.
spring.mongodb.uri=${MONGODB_URI}

# Secret key used to sign and validate JWT tokens.
jwt.secret=${JWT_SECRET}

# JWT expiration time in milliseconds (12 hours).
jwt.expiration=43200000

# Uses the PORT environment variable when deployed, otherwise defaults to 8080 locally.
server.port=${PORT:8080}